name: rebotarm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy<2.0
  - scipy>=1.10
  - pinocchio=3.9.0
  - matplotlib>=3.10.0
  - pyyaml>=6.0
  - libblas=*=*openblas    # conda-forge's NVPL BLAS breaks numpy import on aarch64 (e.g. Jetson)
  - pip
  - pip:
      - opencv-python==4.7.0.72
      - opencv-contrib-python==4.7.0.72
      - ultralytics==8.4.35
      - git+https://github.com/ultralytics/CLIP.git    # text encoder YOLOE needs for set_classes
      - pyrealsense2>=2.54
      - meshcat>=0.3.2
      - motorbridge>=0.1.7
      - funasr==1.1.3
      - modelscope
      - torchaudio
      - soundfile
      - fastapi            # web UI (ui/server.py)
      - uvicorn
